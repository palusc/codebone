name: Publish npm bridge

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify package version matches app release
        run: |
          expected="$(python3 scripts/npm_version.py "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)")"
          actual="$(node -p "require('./package.json').version")"
          test "$expected" = "$actual"
          node --check bin/cbone.js
          npm test
      - name: Stage npm package with igotaboner README
        run: python3 scripts/package_npm.py "$RUNNER_TEMP/igotaboner-package"
      - name: Inspect package contents
        run: npm pack "$RUNNER_TEMP/igotaboner-package" --dry-run
      # Configure this workflow as a trusted publisher in npm package settings.
      # The release workflow calls this only after native artifacts pass validation.
      - name: Check for an identical previously published version
        id: published
        run: python3 scripts/check_npm_release.py "$RUNNER_TEMP/igotaboner-package" --github-output "$GITHUB_OUTPUT"
      - name: Publish igotaboner
        if: steps.published.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/igotaboner-package" --access public --tag latest --provenance

      # Secondary package: gotaboner
      - name: Stage gotaboner package
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'gotaboner-package'
          dest.mkdir(parents=True, exist_ok=True)
          (dest / 'bin').mkdir(exist_ok=True)
          meta = json.loads(Path('package.json').read_text())
          meta['name'] = 'gotaboner'
          meta.pop('scripts', None)
          (dest / 'package.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          for src, tgt in [('bin/cbone.js', 'bin/cbone.js'), ('bin/update.py', 'bin/update.py'), ('LICENSE', 'LICENSE'), ('docs/npm.md', 'README.md')]:
              shutil.copy2(src, dest / tgt)
          PY
      - name: Check for an identical previously published gotaboner
        id: published_gotaboner
        run: python3 scripts/check_npm_release.py "$RUNNER_TEMP/gotaboner-package" --github-output "$GITHUB_OUTPUT"
      - name: Publish gotaboner
        if: steps.published_gotaboner.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/gotaboner-package" --access public --tag latest --provenance

