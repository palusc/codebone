name: Release patch on merge to main

# Every push to main gets its own patch release: version bump, signed DMG/ZIP build,
# Homebrew formula update, git tag and a GitHub Release. This is what the in-app
# updater (src/updater.py) polls, so merging to main is what ships an update — no
# separate manual release step needed.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # A push made by this workflow's own release commit must not trigger another release.
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "codebone-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Cache base model download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/codebone-build
          key: codebone-model-${{ hashFiles('scripts/download_model.py') }}

      - name: Sync to latest main
        # Two pushes to main queued back-to-back both trigger a run, but the concurrency group only
        # lets one run at a time; the second run's checkout is still pinned to the older commit that
        # triggered it, so bumping from that stale version and pushing would be rejected as
        # non-fast-forward once the first run's release commit has landed. Reset to the real tip first.
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)"
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          sed -i '' "s/^__version__ = \".*\"/__version__ = \"${next}\"/" src/__init__.py
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${current} -> ${next}"

      - name: Build DMG + ZIP (scripts/build_dmg.sh)
        run: ./scripts/build_dmg.sh

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          zip_sha="$(shasum -a 256 dist/codebone-macos-arm64.zip | awk '{print $1}')"
          sed -i '' "s#^  url \".*\"#  url \"https://github.com/palusc/codebone/releases/download/v${version}/codebone-macos-arm64.zip\"#" Formula/codebone.rb
          sed -i '' "s#^  sha256 \".*\"#  sha256 \"${zip_sha}\"#" Formula/codebone.rb

      - name: Sync package.json + README version badge
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          sed -i '' "s#\"version\": \".*\"#\"version\": \"${version}\"#" package.json
          sed -i '' "s#version-[0-9][0-9.]*-informational#version-${version}-informational#" README.md
          sed -i '' "s#Version%20[0-9][0-9.]*-#Version%20${version}-#" README.md
          sed -i '' "s#!\[Version [0-9][0-9.]*\]#![Version ${version}]#" README.md

      - name: Commit version bump + formula
        run: |
          git add src/__init__.py Formula/codebone.rb package.json README.md
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          # Prefer the version's own CHANGELOG.md section (curated, human-written); fall back to the
          # merge commit's PR title so a release never ships with no notes at all.
          section="$(awk -v ver="## [$version]" '
            $0 ~ "^" ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          section="$(printf '%s\n' "$section" | sed -e '/./,$!d')"  # drop leading blank lines
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            # By this point HEAD is our own just-created "chore(release): ..." commit, which has no
            # useful body — the commit that actually triggered this run is ${{ github.sha }}.
            section="$(git log -1 --pretty=%B ${{ github.sha }} | tail -n +3 | sed -e '/./,$!d')"
          fi
          {
            echo "$section"
            echo ""
            echo "---"
            echo "Full history: [CHANGELOG.md](https://github.com/palusc/codebone/blob/main/CHANGELOG.md)"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "codebone v${{ steps.bump.outputs.version }}"
          body_path: release_notes.md
          files: |
            dist/codebone-macos-arm64.dmg
            dist/codebone-macos-arm64.zip
            dist/codebone-macos-arm64.zip.sha256
