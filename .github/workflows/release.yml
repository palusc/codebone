name: Release codebone

# Releases are built and published when a release tag is pushed (e.g. `git tag v1.8.0 && git push origin v1.8.0`)
# or manually triggered via GitHub Actions (workflow_dispatch).
# Normal commits and pushes to main do NOT create automated releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.8.0) - leave empty to use tag or src/__init__.py'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "codebone-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Cache base model download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/codebone-build
          key: codebone-model-${{ hashFiles('scripts/download_model.py') }}

      - name: Determine release version
        id: bump
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)"
          fi
          version="${version#v}"
          sed -i '' "s/^__version__ = \".*\"/__version__ = \"${version}\"/" src/__init__.py
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}"

      - name: Build DMG + ZIP (scripts/build_dmg.sh)
        run: ./scripts/build_dmg.sh

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          zip_sha="$(shasum -a 256 dist/codebone-macos-arm64.zip | awk '{print $1}')"
          sed -i '' "s#^  url \".*\"#  url \"https://github.com/palusc/codebone/releases/download/v${version}/codebone-macos-arm64.zip\"#" Formula/codebone.rb
          sed -i '' "s#^  sha256 \".*\"#  sha256 \"${zip_sha}\"#" Formula/codebone.rb

      - name: Sync package.json + README version badge
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          sed -i '' "s#\"version\": \".*\"#\"version\": \"${version}\"#" package.json
          sed -i '' "s#version-[0-9][0-9.]*-informational#version-${version}-informational#" README.md
          sed -i '' "s#Version%20[0-9][0-9.]*-#Version%20${version}-#" README.md
          sed -i '' "s#!\[Version [0-9][0-9.]*\]#![Version ${version}]#" README.md

      - name: Commit version bump + formula (if on branch or manual)
        run: |
          set -euo pipefail
          if git diff --quiet src/__init__.py Formula/codebone.rb package.json README.md; then
            echo "No changes to commit"
          else
            git add src/__init__.py Formula/codebone.rb package.json README.md
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"
            git push origin HEAD:main || true
          fi

      - name: Ensure git tag exists
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          if ! git rev-parse "v${version}" >/dev/null 2>&1; then
            git tag "v${version}"
            git push origin "v${version}"
          fi

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          section="$(awk -v ver="## [$version]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          section="$(printf '%s\n' "$section" | sed -e '/./,$!d')"
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            section="$(git log -1 --pretty=%B | sed -e '/./,$!d')"
          fi
          {
            echo "$section"
            echo ""
            echo "---"
            echo "Full history: [CHANGELOG.md](https://github.com/palusc/codebone/blob/main/CHANGELOG.md)"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "codebone v${{ steps.bump.outputs.version }}"
          body_path: release_notes.md
          files: |
            dist/codebone-macos-arm64.dmg
            dist/codebone-macos-arm64.zip
            dist/codebone-macos-arm64.zip.sha256
            dist/codebone-macos-arm64-update.zip
            dist/codebone-macos-arm64-update.zip.sha256
