name: Release codebone

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a tag matching the checked-in version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          from src import __version__
          from scripts.npm_version import npm_version
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{__version__}', 'Run releases at the version tag'
          assert json.load(open('package.json'))['version'] == npm_version(__version__)
          PY
  windows:
    needs: verify
    uses: ./.github/workflows/windows-build.yml
  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/codebone-build
          key: codebone-model-${{ hashFiles('src/config.py') }}
      - name: Build and validate macOS application
        run: ./scripts/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/codebone-macos-arm64*
          if-no-files-found: error
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from src import __version__
          text = Path('CHANGELOG.md').read_text()
          section = text.split(f'## [{__version__}]', 1)[1].split('\n## [', 1)[0]
          section = section.split('### Release status', 1)[0].strip()
          Path('release_notes.md').write_text(f'codebone {__version__}\n\n' + section + '\n\nWindows x64: installer or portable ZIP. macOS: Apple Silicon DMG.\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          name: codebone ${{ github.ref_name }}
          body_path: release_notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/codebone-windows-x64-setup.exe
            dist/codebone-windows-x64-setup.exe.sha256
            dist/codebone-windows-x64.zip
            dist/codebone-windows-x64.zip.sha256
            dist/codebone-macos-arm64.dmg
            dist/codebone-macos-arm64.zip
            dist/codebone-macos-arm64.zip.sha256
            dist/codebone-macos-arm64-update.zip
            dist/codebone-macos-arm64-update.zip.sha256
  npm:
    needs: publish
    secrets: inherit
    uses: ./.github/workflows/npm-release.yml
    permissions:
      contents: read
      id-token: write
