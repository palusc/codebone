name: Windows build and validation

on:
  push:
    branches: ['codex/windows-2.0']
  pull_request:
  workflow_dispatch:
    inputs:
      sign-windows:
        description: Sign with the configured, verified Microsoft Artifact Signing publisher
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign-windows:
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing scripts and publisher verification
        shell: pwsh
        run: ./scripts/test_windows_signing.ps1
      - name: Require publisher configuration for a signed build
        if: inputs.sign-windows
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request' -or ('${{ github.ref }}' -ne 'refs/heads/main' -and -not '${{ github.ref }}'.StartsWith('refs/tags/v'))) {
            throw 'Signing is restricted to main and release tags.'
          }
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'WINDOWS_SIGNING_ENDPOINT', 'WINDOWS_SIGNING_ACCOUNT', 'WINDOWS_SIGNING_PROFILE', 'WINDOWS_SIGNING_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate signing publisher without a stored password
        if: inputs.sign-windows
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: pip-cache
        with:
          path: ~\AppData\Local\pip\Cache
          key: windows-py312-pip-${{ hashFiles('requirements-windows.txt', 'requirements.lock', 'packaging/windows-cmake.txt') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build/model-cache
          key: codebone-model-${{ hashFiles('src/config.py') }}
      - name: Build portable application and installer
        shell: pwsh
        env:
          SIGN_WINDOWS: ${{ inputs.sign-windows || false }}
        run: |
          try {
            & ./scripts/build_windows.ps1 -SignWindows:($env:SIGN_WINDOWS -eq 'true') *>&1 | Tee-Object -FilePath build-windows.log
          } catch {
            if (Test-Path build-windows.log) {
              $tail = (Get-Content build-windows.log -Tail 80) -join '%0A'
              Write-Output "::error::$tail"
            }
            throw
          }
      - name: Test Windows runtime and bridge
        shell: pwsh
        run: |
          python -m pytest -q tests/test_windows.py tests/test_api_security.py tests/test_indexing.py tests/test_mcp_client.py tests/test_release_consistency.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise packaged EXE, tray, settings, model and HTTP
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'codebone-smoke.json'
          $app = Start-Process -FilePath ./dist/codebone/codebone.exe -ArgumentList @('--smoke-test', $result) -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'Packaged smoke test timed out' }
          if (Test-Path $result) { Get-Content $result }
          if ($app.ExitCode -ne 0) { throw "Packaged smoke test failed: $($app.ExitCode)" }
          if (-not (Test-Path $result)) { throw 'Smoke result missing' }
          $report = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.gui -or -not $report.model) { throw 'Smoke test did not exercise all targets' }
          Get-Content $result
          python scripts/test_packaged_mcp.py ./dist/codebone/cbone.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'codebone-install'
          $installer = Start-Process -FilePath ./dist/codebone-windows-x64-setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target") -Wait -PassThru
          if ($installer.ExitCode -ne 0 -or -not (Test-Path "$target/codebone.exe")) { throw 'Installer failed' }
          if ('${{ inputs.sign-windows }}' -eq 'true') {
            foreach ($file in @('codebone.exe', 'cbone.exe', 'unins000.exe')) {
              & ./scripts/verify_windows_signature.ps1 -FilePath "$target/$file"
            }
          }
          $result = Join-Path $env:RUNNER_TEMP 'codebone-installed-smoke.json'
          $app = Start-Process -FilePath "$target/codebone.exe" -ArgumentList @('--smoke-test', $result) -Wait -PassThru
          if ($app.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Installed app smoke failed' }
          $uninstaller = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw 'Uninstall failed' }
      # Preserve completed dependency wheels even when app packaging/tests fail.
      # CPU build flags are part of the cache key, independent of app source edits.
      - uses: actions/cache/save@v4
        if: always() && steps.pip-cache.outputs.cache-hit != 'true'
        with:
          path: ~\AppData\Local\pip\Cache
          key: windows-py312-pip-${{ hashFiles('requirements-windows.txt', 'requirements.lock', 'packaging/windows-cmake.txt') }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/codebone-windows-x64*
          if-no-files-found: error
