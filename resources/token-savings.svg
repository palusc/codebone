<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title { fill:#8b949e; font-size:12px; }
    .label { fill:#e6edf3; font-size:13px; font-weight:600; }
    .value { fill:#8b949e; font-size:12px; }
    .track { fill:#21262d; }
  </style>

  <rect x="0" y="0" width="640" height="260" fill="#0d1117"/>

  <text class="title" x="20" y="28">Prompt token overhead per architectural query</text>

  <!-- Raw File Dump -->
  <text class="label" x="20" y="68">Raw File Dump</text>
  <rect class="track" x="20" y="78" width="600" height="22" rx="4"/>
  <rect x="20" y="78" width="600" height="22" rx="4" fill="#f85149"/>
  <text class="value" x="630" y="94" text-anchor="end" fill="#e6edf3">~25,000 tokens · slow &amp; expensive</text>

  <!-- Vector RAG Search -->
  <text class="label" x="20" y="138">Vector RAG Search</text>
  <rect class="track" x="20" y="148" width="600" height="22" rx="4"/>
  <rect x="20" y="148" width="336" height="22" rx="4" fill="#d29922"/>
  <text class="value" x="366" y="164" fill="#8b949e">~14,000 tokens · high noise</text>

  <!-- codebone Live Graph -->
  <text class="label" x="20" y="208">codebone Live Graph</text>
  <rect class="track" x="20" y="218" width="600" height="22" rx="4"/>
  <rect x="20" y="218" width="48" height="22" rx="4" fill="#3fb950"/>
  <text class="value" x="78" y="234" fill="#8b949e">~2,000 tokens · ⚡ ~80% savings</text>
</svg>
